<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandoomain Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-asm.js"></script>
    <style>
        /* Custom Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 250px;
            background-color: #333;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -125px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
            pointer-events: none;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* Gene arrow styles */
        .gene-arrow {
            clip-path: polygon(0% 15%, max(0%, calc(100% - 10px)) 15%, 100% 50%, max(0%, calc(100% - 10px)) 85%, 0% 85%);
        }

        .gene-arrow-rev {
            clip-path: polygon(min(100%, 10px) 15%, 100% 15%, 100% 85%, min(100%, 10px) 85%, 0% 50%);
        }

        /* Focused gene area close button */
        #focused-gene-area .close-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            cursor: pointer;
        }

        /* Border effect for gene arrows */
        .arrow-border {
            filter: drop-shadow(0 0 1px #333);
        }

        /* Flat block for a gene segment continuing onto another line */
        .gene-flat {
            clip-path: none;
        }

        /* Continuation marker for genes split across lines */
        .gene-cont {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: #4B5563;
            pointer-events: none;
        }

        /* Domain track rows in the focused-gene panel */
        .dom-track {
            position: relative;
            width: 100%;
            height: 18px;
            background: #F3F4F6;
            border-radius: 3px;
        }

        .dom-band {
            position: absolute;
            top: 2px;
            height: 14px;
            border-radius: 3px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 0, 0, .25);
        }

        /* Tooltips inside scrollable panels need to escape their row */
        .dom-band .tooltiptext,
        .gene-seg .tooltiptext {
            bottom: 140%;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4">
        <main>
            <!-- Header & Upload Section Combined -->
            <section id="upload-section"
                class="bg-white p-6 rounded-lg shadow-md mb-6 flex flex-col lg:flex-row items-center justify-between gap-8">

                <!-- Left: Branding -->
                <div class="flex flex-col items-center lg:items-start space-y-2">
                    <div class="flex items-center gap-4">
                        <img src="logo-browser.svg" alt="Pandoomain Logo" class="h-24 w-24">
                        <h1 class="text-4xl font-bold text-gray-800">Pandoomain<br>Browser</h1>
                    </div>
                    <a href="https://github.com/deMoraes-Lab/Pandoomain" target="_blank"
                        class="text-gray-600 hover:text-blue-600 text-sm font-medium">
                        https://github.com/deMoraes-Lab/Pandoomain
                    </a>
                </div>

                <!-- Right: Load Data -->
                <div class="flex-grow max-w-4xl w-full">
                    <h2 class="text-2xl font-semibold mb-4 text-gray-700">1. Load Data</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="flex flex-col">
                            <label for="neighbors-db-upload"
                                class="mb-1 text-xs font-bold text-gray-500 uppercase tracking-wide">Neighbors
                                Database</label>
                            <input id="neighbors-db-upload" type="file" accept=".db" class="block w-full text-sm text-gray-500
                                file:mr-4 file:py-2 file:px-4
                                file:rounded-full file:border-0
                                file:text-sm file:font-semibold
                                file:bg-blue-50 file:text-blue-700
                                hover:file:bg-blue-100
                            " />
                            <span class="text-xs text-gray-400 mt-1">neighbors.db</span>
                        </div>
                        <div class="flex flex-col">
                            <label for="iscan-db-upload"
                                class="mb-1 text-xs font-bold text-gray-500 uppercase tracking-wide">InterProScan
                                Database</label>
                            <input id="iscan-db-upload" type="file" accept=".db" class="block w-full text-sm text-gray-500
                                file:mr-4 file:py-2 file:px-4
                                file:rounded-full file:border-0
                                file:text-sm file:font-semibold
                                file:bg-green-50 file:text-green-700
                                hover:file:bg-green-100
                            " />
                            <span class="text-xs text-gray-400 mt-1">iscan.db</span>
                        </div>
                        <div class="flex flex-col">
                            <label for="metadata-db-upload"
                                class="mb-1 text-xs font-bold text-gray-500 uppercase tracking-wide">Metadata
                                Database</label>
                            <input id="metadata-db-upload" type="file" accept=".db" class="block w-full text-sm text-gray-500
                                file:mr-4 file:py-2 file:px-4
                                file:rounded-full file:border-0
                                file:text-sm file:font-semibold
                                file:bg-purple-50 file:text-purple-700
                                hover:file:bg-purple-100
                            " />
                            <span class="text-xs text-gray-400 mt-1">metadata.db</span>
                        </div>
                    </div>
                    <div id="status-message" class="mt-4 text-center text-gray-500 text-sm">Ready. Please load all three
                        database files.</div>
                </div>
            </section>

            <!-- Query Section -->
            <section id="query-section" class="bg-white p-6 rounded-lg shadow-md mb-6">
                <h2 class="text-2xl font-semibold mb-4 text-gray-700">2. Find Neighborhoods</h2>
                <div class="flex gap-4">
                    <input type="text" id="search-input" placeholder="Search by Genome ID or Protein ID (pid)..."
                        class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button id="search-button"
                        class="bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-600 disabled:bg-gray-300">Search</button>
                </div>
            </section>

            <!-- Results & Visualization -->
            <section id="results-and-viz" class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                    <h2 class="text-2xl font-semibold text-gray-700">3. Explore</h2>
                    <label class="inline-flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none">
                        <input type="checkbox" id="toggle-arrow-domains" class="cursor-pointer">
                        Show Pfam domains inside gene arrows
                    </label>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <!-- Results List -->
                    <div id="results-section"
                        class="lg:col-span-1 h-96 overflow-y-auto border rounded-lg p-3 bg-gray-50">
                        <p class="text-gray-400">Search results will appear here.</p>
                    </div>

                    <!-- Main Visualization Area -->
                    <div class="lg:col-span-3">
                        <div id="metadata-display" class="mb-4 text-lg text-gray-600 italic"></div>
                        <div id="focused-gene-area"
                            class="hidden p-4 border border-gray-300 rounded-lg mb-4 bg-white relative"></div>
                        <div id="visualization-canvas" class="space-y-2"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- Global State ---
        let neighborsDB = null;
        let iscanDB = null;
        let metadataDB = null;
        const LINE_WIDTH_BP = 12000; // Constant for one line of visualization

        // --- DOM Elements ---
        const neighborsUpload = document.getElementById('neighbors-db-upload');
        const iscanUpload = document.getElementById('iscan-db-upload');
        const metadataUpload = document.getElementById('metadata-db-upload');
        const statusMessage = document.getElementById('status-message');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const resultsSection = document.getElementById('results-section');
        const metadataDisplay = document.getElementById('metadata-display');
        const focusedGeneArea = document.getElementById('focused-gene-area');
        const vizCanvas = document.getElementById('visualization-canvas');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            searchButton.disabled = true;
            const SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` });

            const handleFileUpload = async (event, dbName, dbTarget) => {
                const file = event.target.files[0];
                if (!file) return;

                statusMessage.textContent = `Loading ${dbName}...`;
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const db = new SQL.Database(new Uint8Array(arrayBuffer));
                    if (dbTarget === 'neighbors') neighborsDB = db;
                    else if (dbTarget === 'iscan') iscanDB = db;
                    else if (dbTarget === 'metadata') metadataDB = db;

                    updateStatus();
                } catch (e) {
                    console.error(e);
                    statusMessage.textContent = `Error loading ${dbName}.`;
                }
            };

            neighborsUpload.addEventListener('change', (e) => handleFileUpload(e, 'neighbors.db', 'neighbors'));
            iscanUpload.addEventListener('change', (e) => handleFileUpload(e, 'iscan.db', 'iscan'));
            metadataUpload.addEventListener('change', (e) => handleFileUpload(e, 'metadata.db', 'metadata'));
        });

        function updateStatus() {
            const loaded = [];
            if (neighborsDB) loaded.push('Neighbors');
            if (iscanDB) loaded.push('InterProScan');
            if (metadataDB) loaded.push('Metadata');

            if (loaded.length === 3) {
                statusMessage.textContent = 'All databases loaded! Ready to search.';
                statusMessage.classList.add('text-green-600');
                searchButton.disabled = false;
            } else {
                statusMessage.textContent = `Loaded: ${loaded.join(', ') || 'None'}`;
            }
        }

        // --- Search & Query Logic ---
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm || !neighborsDB) return;

            resultsSection.innerHTML = '<p class="text-gray-500">Searching...</p>';

            try {
                const stmt = neighborsDB.prepare(`
                    SELECT DISTINCT genome, nei
                    FROM neighbors
                    WHERE genome = :term OR pid = :term
                    ORDER BY genome, nei;
                `);
                stmt.bind({ ':term': searchTerm });

                const results = [];
                while (stmt.step()) {
                    results.push(stmt.getAsObject());
                }
                stmt.free();

                renderSearchResults(results);
            } catch (e) {
                console.error(e);
                resultsSection.innerHTML = '<p class="text-red-500">An error occurred during search.</p>';
            }
        }

        function renderSearchResults(results) {
            if (results.length === 0) {
                resultsSection.innerHTML = '<p class="text-gray-500">No matching neighborhoods found.</p>';
                return;
            }

            resultsSection.innerHTML = '';
            const list = document.createElement('ul');
            list.className = 'space-y-2';

            results.forEach(result => {
                const item = document.createElement('li');
                item.className = 'p-2 rounded-md cursor-pointer hover:bg-blue-100';
                item.textContent = `${result.genome} - Neighborhood ${result.nei}`;
                item.addEventListener('click', () => visualizeNeighborhood(result.genome, result.nei));
                list.appendChild(item);
            });
            resultsSection.appendChild(list);
        }

        document.getElementById('toggle-arrow-domains').addEventListener('change', () => {
            if (lastView) visualizeNeighborhood(lastView.genomeId, lastView.neiId);
        });

        // --- Visualization Logic ---
        let lastView = null;

        async function visualizeNeighborhood(genomeId, neiId) {
            // Clear previous state
            vizCanvas.innerHTML = '';
            metadataDisplay.innerHTML = '';
            focusedGeneArea.classList.add('hidden');
            focusedGeneArea.innerHTML = '';
            focusedState = { gene: null, domains: [], sources: null };
            lastView = { genomeId, neiId };

            // 1. Get Genes in Neighborhood
            const genes = neighborsDB.exec(`
                SELECT * FROM neighbors 
                WHERE genome = '${genomeId}' AND nei = ${neiId} 
                ORDER BY start;
            `)[0]?.values.map(row => {
                // Manually map array to object based on known column order
                return { genome: row[0], nei: row[1], neioff: row[2], gene_order: row[3], pid: row[4], gene: row[5], product: row[6], start: row[7], end: row[8], strand: row[9], frame: row[10], locus_tag: row[11], contig: row[12], queries: row[13] };
            }) || [];

            if (genes.length === 0) {
                vizCanvas.innerHTML = '<p class="text-gray-500">No gene data for this neighborhood.</p>';
                return;
            }

            // 2. Get PIDs and fetch domains
            const pids = genes.map(g => g.pid);
            const domains = iscanDB ? iscanDB.exec(`
                SELECT * FROM iscan WHERE pid IN (${pids.map(p => `'${p}'`).join(',')});
            `)[0]?.values || [] : [];

            const domainMap = new Map();
            domains.forEach(d => {
                const domainObj = { pid: d[0], start: d[1], stop: d[2], length: d[3], pfam: d[4], pfam_desc: d[5] };
                if (!domainMap.has(domainObj.pid)) {
                    domainMap.set(domainObj.pid, []);
                }
                domainMap.get(domainObj.pid).push(domainObj);
            });

            // 3. Get and display metadata
            if (metadataDB) {
                const meta = metadataDB.exec(`SELECT org, strain FROM metadata WHERE genome = '${genomeId}'`)[0]?.values[0];
                if (meta) {
                    metadataDisplay.innerHTML = `<em>${meta[0]}</em> (Strain: ${meta[1] || 'N/A'})`;
                }
            }

            // 4. Calculate Layout & Render
            renderGenes(genes, domainMap);
        }

        // Vertical geometry of a gene lane, in px.
        const LANE_H = 26;
        const LANE_GAP = 4;
        const AXIS_PAD = 6;
        // Height reserved *inside* each line box for its coordinate ruler.
        // The ruler used to be drawn above the box with a negative offset,
        // which left it dependent on the container's vertical gap; Tailwind's
        // `space-y-2` on the canvas overrode that gap and the labels landed on
        // the previous line's reverse-strand genes.
        const RULER_H = 20;
        const LINE_GAP = 20;

        // Greedy interval packing. Assigns each item the lowest lane whose last
        // occupant ends at or before the item starts, so only genuinely
        // overlapping intervals are pushed onto separate lanes. Abutting
        // features (end == next start) stay on the same lane.
        // Items must be sorted by `s` ascending. Returns the lane count.
        function packLanes(items) {
            const laneEnds = [];
            items.forEach(it => {
                let lane = laneEnds.findIndex(end => end <= it.s);
                if (lane === -1) {
                    lane = laneEnds.length;
                    laneEnds.push(0);
                }
                laneEnds[lane] = it.e;
                it.lane = lane;
            });
            return laneEnds.length;
        }

        // Clip a gene against one display line and emit the visible piece.
        // A gene wider than the remaining space used to be relocated wholesale
        // to the start of the next line, which both misplaced it and made it
        // collide with whatever really began there. Now it is split, and each
        // piece is drawn at its true coordinate.
        function segmentGene(gene, lineStart, lineEnd) {
            const s = Math.max(gene.start, lineStart);
            const e = Math.min(gene.end, lineEnd);
            if (e <= s) return null;
            return {
                gene,
                s,
                e,
                headLeft: gene.strand === '-' && s === gene.start,
                headRight: gene.strand !== '-' && e === gene.end,
                clippedLeft: s > gene.start,
                clippedRight: e < gene.end,
            };
        }

        function renderGenes(genes, domainMap) {
            const min_start = Math.min(...genes.map(g => g.start));
            const max_end = Math.max(...genes.map(g => g.end));
            const total_span = Math.max(1, max_end - min_start);
            const num_lines = Math.max(1, Math.ceil(total_span / LINE_WIDTH_BP));
            const showDomains = document.getElementById('toggle-arrow-domains')?.checked;

            for (let i = 0; i < num_lines; i++) {
                const line_start_coord = min_start + i * LINE_WIDTH_BP;
                const line_end_coord = line_start_coord + LINE_WIDTH_BP;

                // Split every gene against this line, then separate by strand so
                // forward genes sit above the axis and reverse genes below.
                const segs = genes
                    .map(g => segmentGene(g, line_start_coord, line_end_coord))
                    .filter(Boolean)
                    .sort((a, b) => a.s - b.s);

                const fwd = segs.filter(s => s.gene.strand !== '-');
                const rev = segs.filter(s => s.gene.strand === '-');
                const nFwd = packLanes(fwd);
                const nRev = packLanes(rev);

                const upper = RULER_H + nFwd * (LANE_H + LANE_GAP) + AXIS_PAD;
                const lower = nRev * (LANE_H + LANE_GAP) + AXIS_PAD;

                const lineDiv = document.createElement('div');
                lineDiv.className = 'relative w-full';
                lineDiv.style.height = `${upper + lower}px`;
                // Set inline so it beats the canvas's `space-y-*` utility.
                if (i > 0) lineDiv.style.marginTop = `${LINE_GAP}px`;

                const axis = document.createElement('div');
                axis.className = 'absolute w-full h-px bg-gray-400';
                axis.style.top = `${upper}px`;
                axis.style.zIndex = 0;
                lineDiv.appendChild(axis);

                for (let j = 0; j < 5; j++) {
                    const tick = document.createElement('div');
                    tick.className = 'absolute';
                    tick.style.left = `${(j / 4) * 100}%`;
                    tick.style.top = '0';

                    const label = document.createElement('span');
                    let labelClasses = 'absolute top-0 text-xs text-gray-500 whitespace-nowrap leading-none';
                    if (j === 4) labelClasses += ' -translate-x-full';
                    else if (j !== 0) labelClasses += ' -translate-x-1/2';
                    label.className = labelClasses;
                    label.textContent = (line_start_coord + j * (LINE_WIDTH_BP / 4)).toLocaleString();
                    tick.appendChild(label);
                    lineDiv.appendChild(tick);
                }

                segs.forEach(seg => {
                    const gene = seg.gene;
                    const left_percent = ((seg.s - line_start_coord) / LINE_WIDTH_BP) * 100;
                    const width_percent = ((seg.e - seg.s) / LINE_WIDTH_BP) * 100;
                    const isFwd = gene.strand !== '-';

                    const top = isFwd
                        ? upper - AXIS_PAD - (seg.lane + 1) * (LANE_H + LANE_GAP)
                        : upper + AXIS_PAD + seg.lane * (LANE_H + LANE_GAP);

                    const geneDiv = document.createElement('div');
                    geneDiv.className = 'absolute tooltip gene-seg';
                    geneDiv.style.left = `${left_percent}%`;
                    geneDiv.style.width = `${width_percent}%`;
                    geneDiv.style.top = `${top}px`;
                    geneDiv.style.height = `${LANE_H}px`;
                    geneDiv.style.zIndex = gene.neioff === 0 ? 10 : 1;

                    const arrowWrapper = document.createElement('div');
                    arrowWrapper.className = 'h-full w-full arrow-border relative';

                    const geneBlock = document.createElement('div');
                    const shape = seg.headRight ? 'gene-arrow' : (seg.headLeft ? 'gene-arrow-rev' : 'gene-flat');
                    geneBlock.className = `h-full w-full relative overflow-hidden ${shape}`;
                    geneBlock.style.backgroundColor = gene.neioff === 0 ? '#FBBF24' : '#9CA3AF';

                    // Optional Pfam bands drawn inside the arrow. Off by default so
                    // the neighbourhood view stays readable; the domain detail lives
                    // in the focused-gene panel below.
                    if (showDomains) {
                        const pfams = (domainMap.get(gene.pid) || []).filter(d => isPfam(d.pfam));
                        const aaLen = pfams.length ? Math.max(...pfams.map(d => d.length)) : 0;
                        if (aaLen > 0) {
                            const geneBp = gene.end - gene.start;
                            pfams.forEach(d => {
                                // Protein coordinates run 5'->3', which is right-to-left
                                // on the reverse strand.
                                const f0 = (d.start - 1) / aaLen;
                                const f1 = d.stop / aaLen;
                                const bp0 = isFwd ? gene.start + f0 * geneBp : gene.end - f1 * geneBp;
                                const bp1 = isFwd ? gene.start + f1 * geneBp : gene.end - f0 * geneBp;
                                const vs = Math.max(bp0, seg.s), ve = Math.min(bp1, seg.e);
                                if (ve <= vs) return;
                                const band = document.createElement('div');
                                band.className = 'absolute';
                                band.style.left = `${((vs - seg.s) / (seg.e - seg.s)) * 100}%`;
                                band.style.width = `${((ve - vs) / (seg.e - seg.s)) * 100}%`;
                                band.style.top = '30%';
                                band.style.height = '40%';
                                band.style.backgroundColor = domainColor(d.pfam);
                                band.style.opacity = '0.95';
                                geneBlock.appendChild(band);
                            });
                        }
                    }

                    arrowWrapper.appendChild(geneBlock);

                    if (seg.clippedLeft || seg.clippedRight) {
                        const cont = document.createElement('span');
                        cont.className = 'gene-cont';
                        cont.textContent = seg.clippedLeft ? '«' : '»';
                        cont.style[seg.clippedLeft ? 'left' : 'right'] = '2px';
                        arrowWrapper.appendChild(cont);
                    }

                    const tooltipText = document.createElement('span');
                    tooltipText.className = 'tooltiptext';
                    tooltipText.innerHTML = `<strong>Product:</strong> ${gene.product || 'N/A'}<br>
                                             <strong>PID:</strong> ${gene.pid}<br>
                                             <strong>Gene:</strong> ${gene.gene || 'N/A'}<br>
                                             <strong>Locus Tag:</strong> ${gene.locus_tag || 'N/A'}<br>
                                             <strong>Location:</strong> ${gene.start.toLocaleString()}..${gene.end.toLocaleString()} (${gene.strand})`;
                    geneDiv.appendChild(tooltipText);
                    geneDiv.appendChild(arrowWrapper);
                    geneDiv.addEventListener('click', () => showFocusedGene(gene, domainMap.get(gene.pid) || []));

                    lineDiv.appendChild(geneDiv);
                });

                vizCanvas.appendChild(lineDiv);
            }
        }

        // InterProScan emits signatures from every member database it was run
        // with, not just Pfam. They are stored together in iscan.db, so the
        // viewer has to sort them out before drawing.
        const SIGNATURE_SOURCES = [
            ['Pfam', /^PF\d/],
            ['NCBIfam', /^(NF\d|TIGR\d)/],
            ['PANTHER', /^PTHR/],
            ['Gene3D', /^G3DSA/],
            ['SUPERFAMILY', /^SSF/],
            ['CDD', /^(cd|sd)\d/],
            ['SMART', /^SM\d/],
            ['PROSITE', /^PS\d/],
            ['PRINTS', /^PR\d/],
            ['PIRSF', /^PIRSF/],
            ['HAMAP', /^MF_/],
            ['SFLD', /^SFLD/],
            ['Coils', /^Coil/i],
            ['MobiDB', /^mobidb/i],
        ];

        function signatureSource(acc) {
            const a = String(acc || '');
            const hit = SIGNATURE_SOURCES.find(([, re]) => re.test(a));
            return hit ? hit[0] : 'Other';
        }

        function isPfam(acc) {
            return /^PF\d/.test(String(acc || ''));
        }

        // Sources shown when the panel first opens. Pfam leads because the
        // pipeline's architecture encoding (archs.R) is built from Pfam IDs.
        const DEFAULT_SOURCES = ['Pfam', 'NCBIfam', 'CDD'];

        let focusedState = { gene: null, domains: [], sources: null };

        function showFocusedGene(gene, domains) {
            const sameGene = focusedState.gene && focusedState.gene.pid === gene.pid;
            focusedState.gene = gene;
            focusedState.domains = domains;

            const present = [...new Set(domains.map(d => signatureSource(d.pfam)))]
                .sort((a, b) => {
                    const ia = SIGNATURE_SOURCES.findIndex(s => s[0] === a);
                    const ib = SIGNATURE_SOURCES.findIndex(s => s[0] === b);
                    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
                });

            if (!sameGene || !focusedState.sources) {
                const preset = present.filter(s => DEFAULT_SOURCES.includes(s));
                focusedState.sources = new Set(preset.length ? preset : present);
            }

            renderFocusedGene(present);
        }

        function renderFocusedGene(present) {
            const { gene, domains, sources } = focusedState;
            focusedGeneArea.innerHTML = '';
            focusedGeneArea.classList.remove('hidden');

            const closeBtn = document.createElement('span');
            closeBtn.className = 'close-btn text-gray-500 hover:text-gray-800 text-2xl leading-none';
            closeBtn.innerHTML = '&times;';
            closeBtn.onclick = () => {
                focusedGeneArea.classList.add('hidden');
                focusedGeneArea.innerHTML = '';
                focusedState = { gene: null, domains: [], sources: null };
            };

            const title = document.createElement('h3');
            title.className = 'text-xl font-semibold mb-1 pr-6';
            title.innerHTML = `Focused Gene: ${gene.product || 'N/A'} <span class="text-base font-normal text-gray-600">(${gene.pid})</span>`;

            const subtitle = document.createElement('div');
            subtitle.className = 'text-sm text-gray-500 mb-3';
            const aaLen = domains.length ? Math.max(...domains.map(d => d.length || 0)) : 0;
            subtitle.textContent = [
                gene.gene ? `gene ${gene.gene}` : null,
                gene.locus_tag ? `locus ${gene.locus_tag}` : null,
                aaLen ? `${aaLen} aa` : null,
                `${domains.length} signature${domains.length === 1 ? '' : 's'} from ${present.length} database${present.length === 1 ? '' : 's'}`,
            ].filter(Boolean).join('  ·  ');

            focusedGeneArea.appendChild(closeBtn);
            focusedGeneArea.appendChild(title);
            focusedGeneArea.appendChild(subtitle);

            if (!domains.length || !aaLen) {
                const none = document.createElement('p');
                none.className = 'text-gray-500 text-sm';
                none.textContent = 'No domain annotations for this protein.';
                focusedGeneArea.appendChild(none);
                return;
            }

            // Source filter. Signatures from different databases describe the
            // same protein redundantly, so let the user decide which to see.
            const filterBar = document.createElement('div');
            filterBar.className = 'flex flex-wrap gap-3 mb-3 text-xs';
            present.forEach(srcName => {
                const n = domains.filter(d => signatureSource(d.pfam) === srcName).length;
                const label = document.createElement('label');
                label.className = 'inline-flex items-center gap-1 cursor-pointer select-none';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = sources.has(srcName);
                cb.className = 'cursor-pointer';
                cb.addEventListener('change', () => {
                    if (cb.checked) sources.add(srcName);
                    else sources.delete(srcName);
                    renderFocusedGene(present);
                });
                label.appendChild(cb);
                label.appendChild(document.createTextNode(`${srcName} (${n})`));
                filterBar.appendChild(label);
            });
            focusedGeneArea.appendChild(filterBar);

            // Amino-acid ruler.
            const ruler = document.createElement('div');
            ruler.className = 'relative w-full h-4 text-xs text-gray-500 mb-1';
            for (let j = 0; j <= 4; j++) {
                const t = document.createElement('span');
                t.className = 'absolute';
                t.style.left = `${(j / 4) * 100}%`;
                if (j === 4) t.style.transform = 'translateX(-100%)';
                else if (j !== 0) t.style.transform = 'translateX(-50%)';
                t.textContent = Math.round((j / 4) * aaLen);
                ruler.appendChild(t);
            }
            focusedGeneArea.appendChild(ruler);

            const legendEntries = new Map();

            // One stacked track per database, and within a database one row per
            // packing lane. Previously every signature was drawn absolutely on a
            // single backbone, so a full-length hit painted over every domain
            // beneath it.
            present.filter(s => sources.has(s)).forEach(srcName => {
                const items = domains
                    .filter(d => signatureSource(d.pfam) === srcName)
                    .map(d => ({ ...d, s: d.start, e: d.stop }))
                    .sort((a, b) => a.s - b.s || b.e - a.e);
                if (!items.length) return;

                const nLanes = packLanes(items);

                const row = document.createElement('div');
                row.className = 'flex items-start gap-2 mb-2';

                const nameCell = document.createElement('div');
                nameCell.className = 'w-28 shrink-0 text-xs font-semibold text-gray-600 pt-1';
                nameCell.textContent = srcName;

                const trackWrap = document.createElement('div');
                trackWrap.className = 'flex-grow space-y-1';

                for (let lane = 0; lane < nLanes; lane++) {
                    const track = document.createElement('div');
                    track.className = 'dom-track';
                    items.filter(d => d.lane === lane).forEach(d => {
                        const band = document.createElement('div');
                        band.className = 'dom-band tooltip';
                        band.style.left = `${((d.start - 1) / aaLen) * 100}%`;
                        band.style.width = `${Math.max(0.4, ((d.stop - d.start + 1) / aaLen) * 100)}%`;
                        band.style.backgroundColor = domainColor(d.pfam);

                        const tip = document.createElement('span');
                        tip.className = 'tooltiptext';
                        tip.innerHTML = `<strong>${d.pfam}</strong><br>${d.pfam_desc || ''}<br>${d.start}&ndash;${d.stop} aa (${d.stop - d.start + 1} aa)`;
                        band.appendChild(tip);
                        track.appendChild(band);

                        if (!legendEntries.has(d.pfam)) {
                            legendEntries.set(d.pfam, { pfam: d.pfam, desc: d.pfam_desc, src: srcName });
                        }
                    });
                    trackWrap.appendChild(track);
                }

                row.appendChild(nameCell);
                row.appendChild(trackWrap);
                focusedGeneArea.appendChild(row);
            });

            if (legendEntries.size) {
                const legendList = document.createElement('ul');
                legendList.className = 'mt-3 grid grid-cols-1 md:grid-cols-2 gap-x-6 text-sm';
                [...legendEntries.values()].forEach(({ pfam, desc }) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-start gap-2 py-0.5';
                    li.innerHTML = `<span class="inline-block w-3 h-3 rounded-sm mt-1 shrink-0" style="background-color: ${domainColor(pfam)};"></span><span><strong>${pfam}</strong> ${desc ? '&ndash; ' + desc : ''}</span>`;
                    legendList.appendChild(li);
                });
                focusedGeneArea.appendChild(legendList);
            }
        }

        // --- Utility Functions ---

        // Deterministic colour per signature accession. The previous version
        // packed the hash straight into RGB, which produced near-white and
        // near-black bands that were unreadable against the track. Hashing into
        // hue only, with saturation and lightness pinned, keeps every colour
        // legible and mutually distinguishable.
        function domainColor(str) {
            const s = String(str || '');
            let hash = 0;
            for (let i = 0; i < s.length; i++) {
                hash = (s.charCodeAt(i) + ((hash << 5) - hash)) | 0;
            }
            const hue = Math.abs(hash) % 360;
            const sat = 62 + (Math.abs(hash >> 8) % 18);   // 62-79%
            const light = 55 + (Math.abs(hash >> 16) % 12); // 55-66%
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        }

        // Retained under the original name for any external callers.
        function stringToColor(str) {
            return domainColor(str);
        }

    </script>
